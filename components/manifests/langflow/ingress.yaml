---
# Ingress for LangFlow UI access (Minikube)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langflow
  namespace: ambient-code
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: langflow.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langflow
            port:
              number: 7860
