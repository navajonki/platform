---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-secret
  namespace: ambient-code
type: Opaque
stringData:
  # This will be updated after LangFlow first run
  # For local dev, can use a placeholder
  api-key: "sk-local-dev-key"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow-data
  namespace: ambient-code
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Minikube uses 'standard' storageClass
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: ambient-code
  labels:
    app: langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow
  template:
    metadata:
      labels:
        app: langflow
    spec:
      containers:
      - name: langflow
        image: langflowai/langflow:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7860
          name: http
        env:
        - name: LANGFLOW_DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@langflow-postgres:5432/$(POSTGRES_DB)"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: langflow-postgres
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langflow-postgres
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: langflow-postgres
              key: POSTGRES_DB
        - name: LANGFLOW_AUTO_LOGIN
          value: "true"
        - name: LANGFLOW_SKIP_AUTH_AUTO_LOGIN
          value: "true"
        - name: LANGFLOW_STORE_ENVIRONMENT_VARIABLES
          value: "true"
        # Disable API key requirement for local dev (using SKIP_AUTH_AUTO_LOGIN)
        - name: LANGFLOW_ENABLE_API_KEY
          value: "false"
        # Override PORT env var set by Kubernetes service
        - name: LANGFLOW_PORT
          value: "7860"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 7860
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 7860
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: langflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: langflow
  namespace: ambient-code
  labels:
    app: langflow
spec:
  type: ClusterIP
  ports:
  - port: 7860
    targetPort: 7860
    protocol: TCP
    name: http
  selector:
    app: langflow
